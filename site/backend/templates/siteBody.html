<main class="Seo">
  <h1>{{ heading }}</h1>
  <p>{{ lead }}</p>
  {% include "about_search.html" %}

  <section class="SeoSimilar">
    <h2>Some of the fonts you can search</h2>

      {% endfor %}
    </ul>
  </section>
  {% endif %}
</main>
