<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>viewport test</title>
<meta name="robots" content="noindex">
<script>
  var params = new URLSearchParams(location.search);
  var mode = ["fixed", "sync", "anim", "inner"].indexOf(params.get("mode")) >= 0 ? params.get("mode") : "fixed";
  var fit = params.get("fit") === "cover" ? "cover" : "auto";
  document.write('<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=' + fit + '">');
</script>
<style>
  :root { --band: 90px; --ext: 220px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #18191d; color: #eee; font: 15px/1.4 system-ui, sans-serif; }
  .line { padding: 10px 14px; border-bottom: 1px solid #444; }
  .line:nth-child(5n) { background: #2c3a2c; }

  #out { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(0,0,0,.88); padding: 6px 10px;
         font: 11px/1.25 ui-monospace, Menlo, monospace; white-space: pre; }
  #bar { position: fixed; z-index: 101; left: 0; right: 0; top: 118px; padding: 4px 8px; background: #000; display: flex; flex-wrap: wrap; gap: 4px; }
  #bar a { font: 600 12px system-ui; padding: 6px 8px; border-radius: 6px; border: 1px solid #888; background: #222; color: #fff; text-decoration: none; }
  #bar a.on { background: #c0c; border-color: #fff; }

  /* The shader stand-in: the first --band px (magenta checker) is where the slice sits above the toolbar, the rest
     (cyan checker, --ext tall) is the part that should show under the toolbar. */
  .under { left: 0; right: 0; height: calc(var(--band) + var(--ext)); z-index: 50; pointer-events: none; color: #000;
           font: 700 12px system-ui; padding: 4px 8px;
           background:
             repeating-conic-gradient(#0dd 0 25%, #045 0 50%) 0 0 / 50px 50px; }
  .under::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: var(--band);
                   background: repeating-conic-gradient(#e0e 0 25%, #fff 0 50%) 0 0 / 50px 50px; z-index: -1; }

  /* fixed: the control, a fixed box with the extension past the bottom edge */
  body[data-mode="fixed"] .under { position: fixed; bottom: calc(-1 * var(--ext)); }
  /* sync: an absolute box in the scrolling document, moved to the viewport's bottom by script */
  body[data-mode="sync"] .under { position: absolute; top: 0; left: 0; will-change: transform; }
  /* anim: the same, moved by a scroll-driven animation (--range is set by script) */
  body[data-mode="anim"] .under { position: absolute; top: calc(var(--svh) - var(--band)); animation: follow linear both; animation-timeline: scroll(root); }
  @keyframes follow { from { transform: translateY(0); } to { transform: translateY(var(--range)); } }
  /* inner: the document does not scroll; the page is a scroller above the band, and the box is plain absolute */
  body[data-mode="inner"] { height: 100%; overflow: hidden; }
  html:has(body[data-mode="inner"]) { height: 100%; overflow: hidden; }
  body[data-mode="inner"] #scroller { position: absolute; top: 0; left: 0; right: 0; height: calc(var(--svh) - var(--band)); overflow-y: auto; }
  body[data-mode="inner"] .under { position: absolute; top: calc(var(--svh) - var(--band)); }

  .probe { position: fixed; left: 0; top: 0; width: 1px; visibility: hidden; pointer-events: none; }
  #pSvh { height: 100svh; } #pLvh { height: 100lvh; } #pDvh { height: 100dvh; }
</style>
</head>
<body>
<div id="out">measuring…</div>
<div id="bar"></div>
<div class="probe" id="pSvh"></div><div class="probe" id="pLvh"></div><div class="probe" id="pDvh"></div>

<div id="scroller"><div id="lines" style="padding-top:190px"></div></div>
<div class="under" id="under">mode: slice (magenta) then extension (cyan)</div>

<script>
  document.body.dataset.mode = mode;
  var lines = document.getElementById("lines"), i;
  for (i = 1; i <= 120; i++) {
    var d = document.createElement("div");
    d.className = "line";
    d.textContent = "page text, line " + i + (i === 120 ? "  (end of page)" : "");
    lines.appendChild(d);
  }

  var bar = document.getElementById("bar");
  [["fixed", "mode=fixed"], ["sync", "mode=sync"], ["anim", "mode=anim"], ["inner", "mode=inner"]].forEach(function (m) {
    ["auto", "cover"].forEach(function (f) {
      var a = document.createElement("a");
      a.textContent = m[0] + " " + f;
      a.href = "?" + m[1] + "&fit=" + f;
      if (m[0] === mode && f === fit) a.className = "on";
      bar.appendChild(a);
    });
  });

  function h(id) { return document.getElementById(id).getBoundingClientRect().height; }
  function r(n) { return Math.round(n * 10) / 10; }
  var under = document.getElementById("under"), scroller = document.getElementById("scroller");
  function scrollTop() { return mode === "inner" ? scroller.scrollTop : window.scrollY; }
  function place() {
    var svh = h("pSvh");
    document.documentElement.style.setProperty("--svh", svh + "px");
    if (mode === "sync") {
      under.style.transform = "translateY(" + (window.scrollY + svh - 90) + "px)";
    }
    if (mode === "anim") {
      document.documentElement.style.setProperty("--range", (document.documentElement.scrollHeight - svh) + "px");
    }
  }
  function measure() {
    place();
    var vv = window.visualViewport, s = under.getBoundingClientRect();
    document.getElementById("out").textContent =
      "mode " + mode + "   viewport-fit=" + fit + "   scroll " + r(scrollTop()) + "\n" +
      "screen " + screen.width + "x" + screen.height + "   inner " + innerWidth + "x" + innerHeight + "\n" +
      "visualViewport h " + (vv ? r(vv.height) + " top " + r(vv.offsetTop) : "n/a") + "\n" +
      "svh " + r(h("pSvh")) + "  lvh " + r(h("pLvh")) + "  dvh " + r(h("pDvh")) + "\n" +
      "box top " + r(s.top) + " bottom " + r(s.bottom) + " h " + r(s.height);
  }
  ["scroll", "resize"].forEach(function (e) { addEventListener(e, measure); });
  scroller.addEventListener("scroll", measure);
  if (window.visualViewport) { visualViewport.addEventListener("resize", measure); visualViewport.addEventListener("scroll", measure); }
  measure();
  setInterval(measure, 500);
</script>
</body>
</html>
